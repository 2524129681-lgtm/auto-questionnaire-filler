<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问卷助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>问卷助手</h1>
      <p class="subtitle">LLM 驱动的自动问卷填写</p>
    </header>

    <div id="status-bar" class="status-bar hidden">
      <span id="status-icon"></span>
      <span id="status-text"></span>
    </div>

    <section class="section">
      <h2>API 配置</h2>
      <div class="form-group">
        <label for="baseUrl">API 地址</label>
        <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1" spellcheck="false">
        <p class="hint">支持 OpenAI 兼容接口（DeepSeek、通义千问、月之暗面等）</p>
      </div>

      <div class="form-group">
        <label for="apiKey">API Key</label>
        <div class="input-with-toggle">
          <input type="password" id="apiKey" placeholder="sk-..." spellcheck="false">
          <button type="button" id="toggleKey" class="toggle-btn" title="显示/隐藏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="model">模型名称</label>
        <input type="text" id="model" placeholder="gpt-4o-mini" spellcheck="false">
      </div>

      <div class="form-actions">
        <button id="saveBtn" class="btn btn-primary">保存配置</button>
        <button id="testBtn" class="btn btn-secondary">测试连接</button>
      </div>
    </section>

    <section class="section">
      <h2>填写设置</h2>
      <div class="form-group">
        <label for="tone">回答风格</label>
        <select id="tone">
          <option value="neutral">中性自然</option>
          <option value="positive">积极正面</option>
          <option value="critical">批判性</option>
          <option value="random">随机多样</option>
        </select>
      </div>
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="autoSubmit">
          自动提交问卷
        </label>
        <p class="hint">关闭后只填写不提交，由你手动确认</p>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
